name: Android APK

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Depo ayarları > Secrets and variables > Actions > Variables kısmından API_URL tanımlayın.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://10.0.2.2:8787' }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıklar
        run: npm ci

      - name: Kontroller
        run: |
          npx tsc --noEmit
          npm test

      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install --clean

      - name: APK derle
        working-directory: apps/mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: gur-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
